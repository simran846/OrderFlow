name: OrderFlow CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    name: Test & Build on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: orderflow_test
          MYSQL_USER: orderflow_user
          MYSQL_PASSWORD: orderflow_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u root -prootpassword" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      NODE_ENV: test
      PORT: 5000
      API_PREFIX: /api/v1
      DATABASE_URL: "mysql://orderflow_user:orderflow_password@localhost:3306/orderflow_test"
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: github_ci_jwt_access_secret_min_32_characters_long_12345
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_SECRET: github_ci_jwt_refresh_secret_min_32_characters_long_12345
      JWT_REFRESH_EXPIRATION: 7d
      STRIPE_SECRET_KEY: sk_test_mock_secret_key_ci
      STRIPE_WEBHOOK_SECRET: whsec_mock_webhook_secret_ci
      CORS_ORIGIN: "*"
      LOG_LEVEL: warn

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies reproducibly
        run: npm ci

      - name: 🔧 Generate Prisma Client
        run: npx prisma generate

      - name: 🔍 TypeScript Strict Type Checking
        run: npx tsc --noEmit

      - name: 🧪 Run Automated Test Suite
        run: npm test

      - name: 🏗️ Build Production Bundle
        run: npm run build
