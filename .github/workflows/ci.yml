name: OrderFlow CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend:
    name: Backend CI (Express, Prisma & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: orderflow_test
          MYSQL_USER: orderflow_user
          MYSQL_PASSWORD: orderflow_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u root -prootpassword" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      NODE_ENV: test
      PORT: 5000
      API_PREFIX: /api/v1
      DATABASE_URL: "mysql://orderflow_user:orderflow_password@localhost:3306/orderflow_test"
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: github_ci_jwt_access_secret_min_32_characters_long_12345
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_SECRET: github_ci_jwt_refresh_secret_min_32_characters_long_12345
      JWT_REFRESH_EXPIRATION: 7d
      STRIPE_SECRET_KEY: sk_test_mock_secret_key_ci
      STRIPE_WEBHOOK_SECRET: whsec_mock_webhook_secret_ci
      CORS_ORIGIN: "*"
      LOG_LEVEL: warn

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 📦 Install backend dependencies
        run: npm install

      - name: 🔧 Generate Prisma Client
        run: npx prisma generate

      - name: 🔍 TypeScript Type Checking
        run: npx tsc --noEmit

      - name: 🧪 Run Automated Backend Test Suite
        run: npm test

      - name: 🏗️ Build Backend API (dist/)
        run: npm run build

  frontend:
    name: Frontend CI (Next.js 14 Storefront)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    env:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🔍 TypeScript Type Checking
        run: npx tsc --noEmit

      - name: 🏗️ Build Next.js Production Bundle
        run: npm run build
