version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: orderflow_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: orderflow_dev
      MYSQL_USER: orderflow_user
      MYSQL_PASSWORD: orderflow_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - orderflow_network

  redis:
    image: redis:7-alpine
    container_name: orderflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orderflow_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  orderflow_network:
    driver: bridge
